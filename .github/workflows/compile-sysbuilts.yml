name: Sysbuilts Compilation Station (musl + mimalloc)

on:
  schedule:
    # Run weekly on Sunday at midnight UTC to check for upstream updates
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      musl_tag:
        description: 'musl libc git tag or branch (e.g., v1.2.5; leave empty for latest stable)'
        required: false
        default: 'v1.2.5'
      mimalloc_tag:
        description: 'mimalloc git tag or branch (e.g., v2.1.9; leave empty for latest release)'
        required: false
        default: 'v2.1.9'
      force:
        description: 'Force rebuild even if release tag already exists'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/compile-sysbuilts.yml'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine versions and release tag
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MUSL: ${{ inputs.musl_tag }}
          INPUT_MIMALLOC: ${{ inputs.mimalloc_tag }}
          FORCE_BUILD: ${{ inputs.force }}
        run: |
          # 1. Determine musl version
          if [ -n "$INPUT_MUSL" ]; then
            MUSL_VER="$INPUT_MUSL"
          else
            echo "Querying latest tag for musl libc..."
            MUSL_VER=$(git ls-remote --tags --refs https://github.com/bminor/musl.git 'v1.*' | awk -F'/' '{print $3}' | sort -V | tail -n1)
            [ -z "$MUSL_VER" ] && MUSL_VER="v1.2.5"
          fi

          # 2. Determine mimalloc version
          if [ -n "$INPUT_MIMALLOC" ]; then
            MIMALLOC_VER="$INPUT_MIMALLOC"
          else
            echo "Querying latest tag for mimalloc..."
            MIMALLOC_VER=$(git ls-remote --tags --refs https://github.com/microsoft/mimalloc.git 'v2.*' | awk -F'/' '{print $3}' | sort -V | tail -n1)
            [ -z "$MIMALLOC_VER" ] && MIMALLOC_VER="v2.1.9"
          fi

          RELEASE_TAG="sysbuilts-${MUSL_VER}-${MIMALLOC_VER}"
          echo "Selected musl:     $MUSL_VER"
          echo "Selected mimalloc: $MIMALLOC_VER"
          echo "Target Release:    $RELEASE_TAG"

          echo "musl_tag=$MUSL_VER" >> $GITHUB_OUTPUT
          echo "mimalloc_tag=$MIMALLOC_VER" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          # Check if this release already exists
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 && [ "$FORCE_BUILD" != "true" ]; then
            echo "Release $RELEASE_TAG already exists in this repository. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Proceeding with build for $RELEASE_TAG"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Install build toolchains
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            tar \
            xz-utils

      - name: Clone and Compile musl libc
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          MUSL_TAG="${{ steps.version_check.outputs.musl_tag }}"
          echo "=== Cloning musl libc ($MUSL_TAG) ==="
          git clone --depth 1 --branch "$MUSL_TAG" https://github.com/bminor/musl.git musl-src

          mkdir -p dist/sysroot
          SYSROOT="$(pwd)/dist/sysroot"

          echo "=== Configuring musl libc for x86_64 ==="
          cd musl-src
          ./configure \
            --prefix=/ \
            --syslibdir=/lib \
            --enable-wrapper=all

          echo "=== Building musl libc ==="
          make -j"$(nproc)"

          echo "=== Installing musl libc into sysroot ==="
          make DESTDIR="$SYSROOT" install
          cd ..

          # Create conventional usr/lib and usr/include symlinks if missing
          mkdir -p "$SYSROOT/usr"
          [ ! -d "$SYSROOT/usr/include" ] && ln -sf ../include "$SYSROOT/usr/include"
          [ ! -d "$SYSROOT/usr/lib" ] && ln -sf ../lib "$SYSROOT/usr/lib"

          echo "Musl installed successfully into $SYSROOT."

      - name: Clone and Compile mimalloc
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          MIMALLOC_TAG="${{ steps.version_check.outputs.mimalloc_tag }}"
          echo "=== Cloning mimalloc ($MIMALLOC_TAG) ==="
          git clone --depth 1 --branch "$MIMALLOC_TAG" https://github.com/microsoft/mimalloc.git mimalloc-src

          SYSROOT="$(pwd)/dist/sysroot"
          mkdir -p mimalloc-src/build
          cd mimalloc-src/build

          echo "=== Configuring mimalloc for musl target ==="
          # Use cmake with musl-gcc wrapper generated by our sysroot
          CC="$SYSROOT/bin/musl-gcc" CFLAGS="-I$SYSROOT/include" cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DMI_BUILD_SHARED=ON \
            -DMI_BUILD_STATIC=ON \
            -DMI_BUILD_OBJECT=ON \
            -DMI_BUILD_TESTS=OFF \
            -DMI_OVERRIDE=ON \
            -DCMAKE_INSTALL_PREFIX=/

          echo "=== Compiling mimalloc ==="
          make -j"$(nproc)"

          echo "=== Installing mimalloc into sysroot ==="
          make DESTDIR="$SYSROOT" install
          cd ../..

          echo "mimalloc installed successfully into $SYSROOT."

      - name: Validate Sysroot & Generate Metadata
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          SYSROOT="$(pwd)/dist/sysroot"

          echo "=== Verifying critical sysroot artifacts ==="
          test -f "$SYSROOT/include/stdio.h" || { echo "Missing stdio.h"; exit 1; }
          test -f "$SYSROOT/include/mimalloc.h" || { echo "Missing mimalloc.h"; exit 1; }
          test -f "$SYSROOT/lib/libc.a" || { echo "Missing libc.a"; exit 1; }
          test -f "$SYSROOT/lib/libc.so" || { echo "Missing libc.so"; exit 1; }
          test -f "$SYSROOT/lib/ld-musl-x86_64.so.1" || { echo "Missing ld-musl-x86_64.so.1"; exit 1; }
          test -f "$SYSROOT/lib/crt1.o" || { echo "Missing crt1.o"; exit 1; }
          test -f "$SYSROOT/lib/libmimalloc.a" || { echo "Missing libmimalloc.a"; exit 1; }
          test -f "$SYSROOT/lib/libmimalloc.so" || { echo "Missing libmimalloc.so"; exit 1; }

          # Record version metadata
          cat <<EOF > "$SYSROOT/sysbuilts-metadata.json"
          {
            "target": "x86_64-unknown-linux-musl",
            "musl_version": "${{ steps.version_check.outputs.musl_tag }}",
            "mimalloc_version": "${{ steps.version_check.outputs.mimalloc_tag }}",
            "release_tag": "${{ steps.version_check.outputs.release_tag }}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "${{ steps.version_check.outputs.release_tag }}" > "$SYSROOT/version.txt"
          echo "Sysroot validation complete."

      - name: Package Distribution Archive and Checksums
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          mkdir -p release-assets
          echo "Creating compressed sysroot archive: sysbuilts-x86_64.tar.xz..."
          tar -cJf release-assets/sysbuilts-x86_64.tar.xz -C dist/sysroot .

          cd release-assets
          sha256sum sysbuilts-x86_64.tar.xz > SHA256SUMS.txt
          echo "=== SHA256 Verification Sums ==="
          cat SHA256SUMS.txt
          cd ..

      - name: Upload Artifact
        if: steps.version_check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version_check.outputs.release_tag }}
          path: release-assets/
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.version_check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_check.outputs.release_tag }}
          name: ARK-OS Sysbuilts (${{ steps.version_check.outputs.release_tag }})
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            Automated Sysbuilts (musl libc + mimalloc) sysroot for ARK-OS.

            - **Target Architecture:** `x86_64-unknown-linux-musl`
            - **musl libc Version:** `${{ steps.version_check.outputs.musl_tag }}`
            - **mimalloc Version:** `${{ steps.version_check.outputs.mimalloc_tag }}`
            - **Dynamic Linker:** `/lib/ld-musl-x86_64.so.1`

            ### Contents

            - `include/`: musl C headers (`stdio.h`, `unistd.h`, etc.) and `mimalloc.h`
            - `lib/libc.a` & `lib/libc.so`: musl standard library and dynamic linker
            - `lib/crt1.o`, `crti.o`, `crtn.o`, `rcrt1.o`, `Scrt1.o`: ELF startup objects
            - `lib/libmimalloc.a` & `lib/libmimalloc.so`: mimalloc high-performance allocator
            - `bin/musl-gcc`: Spec-configured GCC wrapper targeting the sysroot

            ### Checksum Verification

            ```bash
            sha256sum -c SHA256SUMS.txt
            tar -xf sysbuilts-x86_64.tar.xz -C <target_sysroot_dir>
            ```
